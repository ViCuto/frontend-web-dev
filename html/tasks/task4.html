<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/form-styles.css">
    <title>HTML Form</title>
</head>

<body>
    <form>
        <h1>Форма за регистрация</h1>
        <fieldset>
            <legend>Основна информация:</legend>
            <label for="fname">Име: *</label>
            <input type="text" id="fname" name="fname">
            <label for="lname">Фамилия: *</label>
            <input type="text" id="lname" name="lname" required>
            <label for="email">Email: *</label>
            <input type="email" id ="email" name="email" required>
            <label for="password">Парола: *</label>
            <input type="password" id="password" name="password" required minlength="8">
            <span><sup>*(мин. 8 символа)</sup></span>
            <label for="confirm-password">Потвърдете паролата: *</label>
            <input type="password" id="confirm-password" name="confirm-password" required minlength="8">
            <p class="required-note">* задължителни полета</p>
        </fieldset>
        <fieldset>
            <legend>Допълнителна информация:</legend>
            <p>Има ли предишен опит с програмиране:</p>
            <div class="radio-group">
                <input type="radio" id="experience-yes" name="experience" value="yes">
                <label for="experience-yes">Да</label>
                <input type="radio" id="experience-no" name="experience" value="no">
                <label for="experience-no">Не</label>
            </div>
            <input type="checkbox" id="rules" name="rules">
            <label for="rules">Съгласен съм с правилата на СУ</label>

            <label for="faculty">Факултет:</label>
            <select id="faculty" name="faculty">
                <option value="" disabled selected>Изберете факултет</option>
                <option value="fmi">ФМИ</option>
                <option value="bf">БФ</option>
                <option value="yf">ЮФ</option>
                <option value="mf">МФ</option>
                <option value="ff">ФФ</option>
            </select>
            <label for="comments">Допълнителни коментари:</label>
            <textarea id="comments" name="comments" rows="5" cols="40"></textarea>
            <label for="file-upload">Качи файл (.pdf):</label>
            <input type="file" id="file-upload" name="file-upload" accept=".pdf">
        </fieldset>
        <div class="button-container">
            <input type="reset" value="Изчисти">
            <input type="submit" value="Регистрирай се">
        </div>
    </form>
</body>

</html>
